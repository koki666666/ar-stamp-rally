<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ARスタンプラリー</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

  <!-- ===========================
       ARシーン
  ============================ -->
  <a-scene
    id="ar-scene"
    mindar-image="
      imageTargetSrc: http://localhost/ar-stamp-admin/targets/targets.mind;
      autoStart: true;
      maxTrack: 1;
    "
    color-space="sRGB"
    renderer="
      colorManagement: true;
      physicallyCorrectLights: true;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- ===========================
         AR内で使用する画像
    ============================ -->
    <a-assets>
      <img
        id="sadamon-image"
        src="/characters/sadamon_a.png"
        alt=""
      />
    </a-assets>

    <!-- ARカメラ -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!--
      APIのスポット数に合わせて
      main.jsからARターゲットを自動生成する
    -->
    <a-entity id="ar-target-container"></a-entity>
  </a-scene>

  <!-- ===========================
       ポスター認識後の追従キャラクター
  ============================ -->
  <div
    id="following-character"
    class="following-character"
    aria-hidden="true"
  >
    <img
      src="/characters/sadamon_a.png"
      alt="さだモン"
    />
  </div>

  <!-- ===========================
       画像認識ガイド文
  ============================ -->
  <div
    id="scan-guide"
    class="scan-guide"
    aria-hidden="false"
  >
    <p class="scan-guide-text">
      この枠の中にポスターを映してください
    </p>
  </div>

  <!-- ===========================
       スタンプ台紙を開くボタン
  ============================ -->
  <button
    id="stamp-book-button"
    class="stamp-book-button"
    type="button"
  >
    スタンプ
    <span id="stamp-count">
      0 / 0
    </span>
  </button>

  <!-- ===========================
       クイズ画面
  ============================ -->
  <div
    id="quiz-modal"
    class="quiz-modal"
    aria-hidden="true"
  >
    <div class="quiz-card">
      <div class="speech-triangle"></div>

      <h1 id="quiz-question">
        問題を読み込んでいます。
      </h1>

      <div
        id="quiz-options"
        class="quiz-options"
      ></div>

      <p
        id="quiz-result"
        class="quiz-result"
      ></p>

      <button
        id="quiz-close-button"
        class="quiz-close-button"
        type="button"
      >
        閉じる
      </button>
    </div>
  </div>

  <!-- ===========================
       スタンプ台紙画面
  ============================ -->
  <div
    id="stamp-modal"
    class="stamp-modal"
    aria-hidden="true"
  >
    <div class="stamp-card">
      <div class="stamp-card-header">
        <div>
          <p class="stamp-card-label">
            ARスタンプラリー
          </p>

          <h2>
            スタンプ台紙
          </h2>
        </div>

        <button
          id="stamp-close-button"
          class="stamp-close-button"
          type="button"
          aria-label="スタンプ台紙を閉じる"
        >
          ×
        </button>
      </div>

      <p class="stamp-progress-text">
        獲得したスタンプ：

        <strong id="stamp-modal-count">
          0 / 0
        </strong>
      </p>

      <!--
        APIのスポット数に合わせて
        main.jsからスタンプ欄を自動生成する
      -->
      <div
        id="stamp-list"
        class="stamp-list"
      ></div>

      <!-- 全スタンプ獲得後に表示 -->
      <div
        id="complete-message"
        class="complete-message"
      >
        <p>
          スタンプラリー達成！
        </p>

        <span>
          すべてのスタンプを獲得しました。
        </span>
      </div>
    </div>
  </div>

  <script
    type="module"
    src="/src/main.js"
  ></script>
</body>
</html>
