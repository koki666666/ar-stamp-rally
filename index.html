<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>ARスタンプラリー</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>

  <body>
    <!-- AR画面 -->
    <a-scene
      mindar-image="
        imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind;
        autoStart: true;
      "
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="
        colorManagement: true;
        physicallyCorrectLights: true;
      "
    >
      <!-- 3Dモデル -->
      <a-assets>
        <a-asset-item
          id="character-model-data"
          src="/models/character.glb"
        ></a-asset-item>
      </a-assets>

      <!-- ARカメラ -->
      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
      ></a-camera>

      <!-- 認識対象 -->
      <a-entity
        id="ar-target"
        mindar-image-target="targetIndex: 0"
      >
        <!-- 認識位置確認用の青い板 -->
        <a-plane
          color="#4b73ff"
          opacity="0.15"
          position="0 0 0"
          width="1"
          height="0.552"
        ></a-plane>

        <!-- 仮の3Dキャラクター -->
        <a-entity
          id="character-model"
          gltf-model="#character-model-data"
          position="0 0.1 0.15"
          rotation="0 0 0"
          scale="0.01 0.01 0.01"
        ></a-entity>

      <!-- 環境光 -->
      <a-entity
        light="
          type: ambient;
          color: #ffffff;
          intensity: 1.5;
        "
      ></a-entity>

      <!-- 方向光 -->
      <a-entity
        light="
          type: directional;
          color: #ffffff;
          intensity: 1;
        "
        position="1 2 1"
      ></a-entity>
    </a-scene>

    <!-- スタンプ台紙を開くボタン -->
    <button
      id="stamp-book-button"
      class="stamp-book-button"
      type="button"
    >
      スタンプ
      <span id="stamp-count">0 / 3</span>
    </button>

    <!-- キャラクターのクイズ画面 -->
    <div
      id="quiz-modal"
      class="quiz-modal"
      aria-hidden="true"
    >
      <div class="quiz-card">
        <div class="speech-triangle"></div>

        <h1 id="quiz-question">
          島根県の県庁所在地はどこでしょう？
        </h1>

        <div
          id="quiz-options"
          class="quiz-options"
        >
          <button
            class="quiz-option"
            type="button"
            data-answer="出雲市"
          >
            出雲市
          </button>

          <button
            class="quiz-option"
            type="button"
            data-answer="松江市"
          >
            松江市
          </button>

          <button
            class="quiz-option"
            type="button"
            data-answer="浜田市"
          >
            浜田市
          </button>
        </div>

        <p
          id="quiz-result"
          class="quiz-result"
        ></p>

        <button
          id="quiz-close-button"
          class="quiz-close-button"
          type="button"
        >
          閉じる
        </button>
      </div>
    </div>

    <!-- スタンプ台紙画面 -->
    <div
      id="stamp-modal"
      class="stamp-modal"
      aria-hidden="true"
    >
      <div class="stamp-card">
        <div class="stamp-card-header">
          <div>
            <p class="stamp-card-label">
              ARスタンプラリー
            </p>

            <h2>スタンプ台紙</h2>
          </div>

          <button
            id="stamp-close-button"
            class="stamp-close-button"
            type="button"
            aria-label="スタンプ台紙を閉じる"
          >
            ×
          </button>
        </div>

        <p class="stamp-progress-text">
          獲得したスタンプ：
          <strong id="stamp-modal-count">
            0 / 3
          </strong>
        </p>

        <div class="stamp-list">
          <!-- スポット1 -->
          <div
            class="stamp-item"
            data-stamp-id="stamp-spot-1"
          >
            <div class="stamp-mark">
              <img
                class="stamp-image"
                src="/images/仮画像.png"
                alt="スポット1のスタンプ"
              />

              <span class="stamp-placeholder">
                ？
              </span>
            </div>

            <div class="stamp-information">
              <p class="stamp-number">
                SPOT 1
              </p>

              <h3>スポット1</h3>

              <p class="stamp-status">
                未獲得
              </p>
            </div>
          </div>

          <!-- スポット2 -->
          <div
            class="stamp-item"
            data-stamp-id="stamp-spot-2"
          >
            <div class="stamp-mark">
              <img
                class="stamp-image"
                src="/images/仮画像.png"
                alt="スポット2のスタンプ"
              />

              <span class="stamp-placeholder">
                ？
              </span>
            </div>

            <div class="stamp-information">
              <p class="stamp-number">
                SPOT 2
              </p>

              <h3>スポット2</h3>

              <p class="stamp-status">
                未獲得
              </p>
            </div>
          </div>

          <!-- スポット3 -->
          <div
            class="stamp-item"
            data-stamp-id="stamp-spot-3"
          >
            <div class="stamp-mark">
              <img
                class="stamp-image"
                src="/images/仮画像.png"
                alt="スポット3のスタンプ"
              />

              <span class="stamp-placeholder">
                ？
              </span>
            </div>

            <div class="stamp-information">
              <p class="stamp-number">
                SPOT 3
              </p>

              <h3>スポット3</h3>

              <p class="stamp-status">
                未獲得
              </p>
            </div>
          </div>
        </div>

        <!-- 全スタンプ獲得後に表示 -->
        <div
          id="complete-message"
          class="complete-message"
        >
          <p>スタンプラリー達成！</p>

          <span>
            すべてのスタンプを獲得しました。
          </span>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
